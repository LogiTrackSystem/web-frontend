<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogiTrack — Panel de Gestión</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">LT</div>
        <div class="brand-text">
          <strong>LogiTrack</strong>
          <span>Panel de gestión</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item" data-nav="dashboard">
          <span class="nav-icon">📊</span> Dashboard
        </button>
        <button class="nav-item" data-nav="vehiculos">
          <span class="nav-icon">🚛</span> Vehículos
        </button>
        <button class="nav-item" data-nav="conductores">
          <span class="nav-icon">🧑‍✈️</span> Conductores
        </button>
        <button class="nav-item" data-nav="envios">
          <span class="nav-icon">📦</span> Envíos
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="api-status" id="api-status">
          <span class="dot"></span>
          <span id="api-status-text">Verificando API…</span>
        </div>
        <button class="ghost-btn small" id="btn-config-api" type="button">⚙️ Configurar API</button>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">
      <header class="topbar">
        <button class="ghost-btn icon-btn" id="btn-toggle-sidebar" type="button" aria-label="Menú">☰</button>
        <div class="topbar-title">
          <h1 id="view-title">Dashboard</h1>
          <p id="view-subtitle">Resumen del sistema LogiTrack</p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- ===== Modal ===== -->
  <div id="modal-root"></div>

  <!-- ===== Toasts ===== -->
  <div id="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
