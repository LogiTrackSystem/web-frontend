<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogiTrack — Panel de Gestión</title>
  <meta name="description" content="LogiTrack: panel de gestión de flota, envíos, rutas, telemetría, mantenimiento, aduana, notificaciones, facturación y analítica." />
  <meta name="theme-color" content="#12131c" />
  <!-- Tipografías: SF Pro (San Francisco, Apple) vía CDN; Inter y el stack
       del sistema quedan como respaldo si no hay red. -->
  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>LT</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Loading overlay ===== -->
  <div id="loading" class="loading-overlay" aria-hidden="true" role="status">
    <div class="loading-box">
      <div class="loading-logo">LT</div>
      <div class="loading-spinner"></div>
      <p class="loading-text">Cargando…</p>
    </div>
  </div>
  <div class="app">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">LT</div>
        <div class="brand-text">
          <strong>LogiTrack</strong>
          <span>Panorama de logística</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <span class="nav-label">General</span>
        <button class="nav-item" data-nav="dashboard">
          <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Dashboard
        </button>

        <span class="nav-label">Flota</span>
        <button class="nav-item" data-nav="vehiculos">
          <span class="nav-icon"><i data-lucide="truck"></i></span> Vehículos
        </button>
        <button class="nav-item" data-nav="conductores">
          <span class="nav-icon"><i data-lucide="users"></i></span> Conductores
        </button>
        <button class="nav-item" data-nav="telemetria">
          <span class="nav-icon"><i data-lucide="activity"></i></span> Telemetría
        </button>
        <button class="nav-item" data-nav="mantenimiento">
          <span class="nav-icon"><i data-lucide="wrench"></i></span> Mantenimiento
        </button>

        <span class="nav-label">Operaciones</span>
        <button class="nav-item" data-nav="envios">
          <span class="nav-icon"><i data-lucide="package"></i></span> Envíos
        </button>
        <button class="nav-item" data-nav="rutas">
          <span class="nav-icon"><i data-lucide="route"></i></span> Rutas
        </button>
        <button class="nav-item" data-nav="aduana">
          <span class="nav-icon"><i data-lucide="stamp"></i></span> Aduana
        </button>

        <span class="nav-label">Negocio</span>
        <button class="nav-item" data-nav="facturacion">
          <span class="nav-icon"><i data-lucide="receipt"></i></span> Facturación
        </button>
        <button class="nav-item" data-nav="notificaciones">
          <span class="nav-icon"><i data-lucide="bell"></i></span> Notificaciones
        </button>

        <span class="nav-label">Inteligencia</span>
        <button class="nav-item" data-nav="analitica">
          <span class="nav-icon"><i data-lucide="bar-chart-3"></i></span> Analítica
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="api-status" id="api-status">
          <span class="dot"></span>
          <span id="api-status-text">Verificando API…</span>
        </div>
        <button class="ghost-btn small" id="btn-config-api" type="button">
          <span class="nav-icon"><i data-lucide="settings"></i></span> Configurar API
        </button>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">
      <header class="topbar">
        <button class="ghost-btn icon-btn" id="btn-toggle-sidebar" type="button" aria-label="Menú"><i data-lucide="menu"></i></button>
        <div class="topbar-heading">
          <span class="topbar-icon" id="topbar-icon" aria-hidden="true"></span>
          <div class="topbar-title">
            <h1 id="view-title">Dashboard</h1>
            <p id="view-subtitle">Resumen del sistema LogiTrack</p>
          </div>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- ===== Modal ===== -->
  <div id="modal-root"></div>

  <!-- ===== Toasts ===== -->
  <div id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
